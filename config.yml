# vpn-dns-watcher configuration
#
# Each entry maps a DNS suffix to the nameserver(s) that should resolve it,
# but ONLY while at least one of those nameservers is reachable through a
# VPN tunnel interface (utun*). When the tunnel drops, the matching
# /etc/resolver override is removed and normal DNS resumes.
#
# Detection is per-entry, so unrelated VPNs coexist without extra config.
# Edit this file any time -- the daemon re-reads it on every poll.
#
# Fill in your own internal domains and their private DNS servers below.
# The commented block shows the expected shape.

hosts: []

# hosts:
#   - domain: <internal-dns-suffix>
#     nameservers:
#       - <private-dns-server-ip>
#
#   - domain: <another-suffix>
#     nameservers:
#       - <primary-dns-ip>
#       - <secondary-dns-ip>
